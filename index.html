<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interio — Kitchen Atelier</title>
<meta name="description" content="Interio — a studio where kitchens are composed like a game and built from real modules.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Global site header (always visible) -->
<header id="site-header">
  <a class="brand" href="#" aria-label="Interio home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="brand-name">Interio</span></a>
  <div class="site-actions">
    <button class="claude-pill" id="hdr-ai" title="Claude connection"><i class="dot" aria-hidden="true"></i><span>Claude</span></button>
    <button class="icon-btn" id="hdr-bag" aria-label="Shopping bag"><span data-ico="bag"></span><b class="badge" id="hdr-bag-count" hidden>0</b></button>
  </div>
</header>

<!-- ───────────── HUB: one screen — the brief on the left, the result on the right ───────────── -->
<main id="hub">
  <div class="hub-main">
    <section id="ai-brief" class="brief-pane" aria-label="Kitchen parameters"></section>
    <section id="stage-pane" class="stage-pane" aria-live="polite">
      <figure class="hero-art" id="hero-fig" aria-hidden="true"><canvas id="hero-canvas" width="900" height="620"></canvas></figure>
      <div id="ai-results" class="results" hidden><div id="ai-results-grid" class="results-grid"></div></div>
      <div id="ai-brief-status" class="stage-status"></div>
    </section>
  </div>
  <footer class="app-foot">
    <nav aria-label="Your kitchens"><button id="open-saved" hidden>Saved <span id="saved-count"></span></button><button id="open-collection">Collection</button></nav>
    <nav aria-label="Help"><a href="how-it-works.html">How it works</a><a href="how-to-use.html">How to use</a></nav>
  </footer>
</main>

<!-- ───────────── DESIGNER ───────────── -->
<div id="designer" hidden>
  <aside id="panel" aria-label="Side panel"></aside>

  <section id="stage">
    <!-- design header -->
    <div id="design-header" class="topbar">
      <button class="icon-btn" id="btn-sidebar" aria-label="Close side panel" title="Toggle side panel"><span data-ico="sidebar"></span></button>
      <input id="design-title" class="title-input" value="My kitchen" aria-label="Design title" maxlength="60">
      <span class="grow"></span>
      <button class="icon-btn" id="btn-bag" aria-label="Shopping bag"><span data-ico="bag"></span><b class="badge" id="bag-count" hidden>0</b></button>
      <button class="icon-btn" id="btn-share" aria-label="Share this design"><span data-ico="share"></span></button>
      <button class="icon-btn" id="btn-save" aria-label="Save options"><span data-ico="save"></span></button>
      <span class="total" id="total">Rs.<b>0</b></span>
      <button class="pill-btn primary" id="btn-summary" disabled>Summary <span data-ico="arrow"></span></button>
      <span class="vsep"></span>
      <button class="icon-btn" id="btn-exit" aria-label="Cancel and leave design"><span data-ico="close"></span></button>
    </div>

    <!-- edit-room header -->
    <div id="edit-header" class="topbar" hidden>
      <div class="seg-pair" id="undo-redo">
        <button class="icon-btn" id="btn-undo" aria-label="Undo" disabled><span data-ico="undo"></span></button>
        <button class="icon-btn" id="btn-redo" aria-label="Redo" disabled><span data-ico="redo"></span></button>
      </div>
      <div class="seg-pair modes" id="edit-modes">
        <button id="mode-plan" class="on">Floor plan</button><button id="mode-ceil">Ceiling height</button>
      </div>
      <span class="grow"></span>
      <button class="icon-btn" id="btn-edit-cancel" aria-label="Cancel editing"><span data-ico="close"></span></button>
    </div>

    <!-- 3D viewport -->
    <div id="view">
      <canvas id="gl" tabindex="0" aria-label="3D room canvas"></canvas>
      <svg id="dims" aria-hidden="true"></svg>
      <div id="labels" aria-hidden="true"></div>
      <div id="handles"></div>

      <div id="zoom" role="group" aria-label="Zoom">
        <button id="zoom-in" aria-label="Zoom in"><span data-ico="plus"></span></button>
        <button id="zoom-out" aria-label="Zoom out"><span data-ico="minus"></span></button>
      </div>

      <!-- floating controls for the selected object -->
      <div id="itemfloat" hidden>
        <div id="swatches" class="swatches"></div>
        <div id="rotbox" class="rotbox" hidden>
          <output id="rotval">0</output>
          <div class="rottrack"><input id="rotslider" type="range" min="-180" max="180" step="1" value="0" aria-label="Rotation in degrees"></div>
        </div>
        <div id="pill" class="itempill" role="toolbar" aria-label="Item actions"></div>
      </div>

      <div id="strip" hidden></div>
      <div id="viewchip" hidden></div>

      <aside id="warn" class="warn-drawer" aria-label="Safety warnings and tips">
        <button id="warn-toggle" aria-expanded="false"><span data-ico="warn"></span><span class="warn-label">Safety warnings &amp; tips</span><b class="badge" id="warn-count" hidden>0</b></button>
        <div id="warn-body" hidden></div>
      </aside>

      <div id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <!-- bottom bar -->
    <div id="bottombar">
      <button class="bb on" id="bb-doll" title="Dollhouse view"><span data-ico="dollhouse"></span>Dollhouse</button>
      <button class="bb" id="bb-top" title="Switch to top view"><span data-ico="top"></span>Top view</button>
      <button class="bb" id="bb-side" aria-haspopup="true" title="Side views"><span data-ico="sides"></span>Side views <span data-ico="chev" class="mini"></span></button>
      <span class="vsep"></span>
      <button class="bb" id="bb-move" disabled aria-haspopup="true">Move to</button>
      <button class="bb solid" id="bb-goback" hidden>Go back</button>
      <span class="vsep"></span>
      <button class="bb ico" id="bb-wall" aria-label="Wall color" title="Wall color"><span data-ico="palette"></span></button>
      <button class="bb ico" id="bb-measure" aria-label="Show measurement options" title="Measurements"><span data-ico="ruler"></span></button>
      <span class="vsep"></span>
      <button class="bb" id="bb-edit"><span data-ico="edit"></span>Edit room</button>
    </div>

    <div id="popover-root"></div>
  </section>
</div>

<div id="modal-root"></div>
<div id="cookie" hidden><p>Your kitchens stay in this browser.</p><button class="pill-btn sm" id="cookie-ok">OK</button><button id="cookie-set" hidden></button></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/anthropic-sdk.min.js"></script>
<script src="designs/gallery.js"></script>
<script src="app.js"></script>
</body>
</html>
